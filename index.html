<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UKUKAS</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-10 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold tracking-wider text-emerald-400">UKUKAS</h1>
      <p class="text-[11px] text-slate-400">Personal Cashflow Tracker</p>
    </div>
    <div class="flex gap-2">
      <button onclick="loadData()" class="p-2 bg-slate-800 rounded-lg text-xs hover:bg-slate-700">🔄</button>
      <button onclick="openSettings()" class="p-2 bg-slate-800 rounded-lg text-xs hover:bg-slate-700">⚙️</button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-5">
    <!-- Total Saldo Card -->
    <div class="bg-gradient-to-br from-emerald-600 to-teal-800 rounded-2xl p-5 shadow-lg">
      <p class="text-xs text-emerald-100 uppercase tracking-wider">Total Saldo Bersih</p>
      <h2 id="totalBalance" class="text-3xl font-extrabold mt-1">Rp 0</h2>
      <div id="walletGrid" class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-emerald-400/30 text-xs"></div>
    </div>

    <!-- Form Input -->
    <form id="trxForm" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
      <div class="grid grid-cols-3 gap-2 bg-slate-950 p-1 rounded-xl text-xs font-semibold">
        <button type="button" onclick="setTipe('Pengeluaran')" id="btn-Pengeluaran" class="tipe-btn py-2 rounded-lg bg-rose-600 text-white">Keluar</button>
        <button type="button" onclick="setTipe('Pemasukan')" id="btn-Pemasukan" class="tipe-btn py-2 rounded-lg text-slate-400">Masuk</button>
        <button type="button" onclick="setTipe('Pindah Saldo')" id="btn-Pindah Saldo" class="tipe-btn py-2 rounded-lg text-slate-400">Pindah</button>
      </div>
      <input type="hidden" id="tipe" value="Pengeluaran" />

      <div>
        <label class="text-xs text-slate-400">Nominal (Rp)</label>
        <input type="number" id="nominal" required placeholder="25000" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-lg font-bold focus:outline-none focus:border-emerald-500" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label id="labelDompet" class="text-xs text-slate-400">Dompet</label>
          <select id="dompet" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
            <option value="OCTO Savers+">OCTO Savers+</option>
            <option value="bluSaving">bluSaving</option>
            <option value="E-Wallet">E-Wallet</option>
            <option value="Cash">Cash</option>
          </select>
        </div>

        <div id="kategoriBox">
          <label class="text-xs text-slate-400">Kategori</label>
          <select id="kategori" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
            <option value="Makan & Kopi">Makan & Kopi</option>
            <option value="Transport">Transport</option>
            <option value="Tagihan & Kos">Tagihan & Kos</option>
            <option value="Belanja">Belanja</option>
            <option value="Hiburan">Hiburan</option>
            <option value="Gaji / Bonus">Gaji / Bonus</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <div id="tujuanBox" class="hidden">
          <label class="text-xs text-slate-400">Ke Dompet</label>
          <select id="tujuan" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
            <option value="bluSaving">bluSaving</option>
            <option value="OCTO Savers+">OCTO Savers+</option>
            <option value="E-Wallet">E-Wallet</option>
            <option value="Cash">Cash</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs text-slate-400">Catatan (Opsional)</label>
        <input type="text" id="catatan" placeholder="Kopi susu / Bensin..." class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" />
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition">
        Simpan Transaksi
      </button>
    </form>

    <!-- Riwayat Terakhir -->
    <div>
      <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">15 Transaksi Terakhir</h3>
      <div id="recentList" class="space-y-2 text-sm">
        <p class="text-slate-500 text-xs text-center py-4">Belum ada data atau URL API belum diatur.</p>
      </div>
    </div>
  </main>

  <!-- Modal Settings URL API -->
  <div id="settingsModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-sm space-y-3">
      <h3 class="font-bold text-base">Pengaturan API Google Script</h3>
      <p class="text-xs text-slate-400">Tempel Web App URL dari Google Apps Script di sini (tersimpan aman di HP kamu).</p>
      <input type="url" id="apiUrlInput" placeholder="https://script.google.com/macros/s/..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeSettings()" class="px-4 py-2 text-xs text-slate-400">Batal</button>
        <button onclick="saveSettings()" class="px-4 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    const formatRp = (num) => 'Rp ' + Number(num || 0).toLocaleString('id-ID');
    const getApiUrl = () => localStorage.getItem('ukukas_api_url') || '';

    function openSettings() {
      document.getElementById('apiUrlInput').value = getApiUrl();
      document.getElementById('settingsModal').classList.remove('hidden');
      document.getElementById('settingsModal').classList.add('flex');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.add('hidden');
      document.getElementById('settingsModal').classList.remove('flex');
    }

    function saveSettings() {
      const url = document.getElementById('apiUrlInput').value.trim();
      localStorage.setItem('ukukas_api_url', url);
      closeSettings();
      loadData();
    }

    function setTipe(tipe) {
      document.getElementById('tipe').value = tipe;
      document.querySelectorAll('.tipe-btn').forEach(btn => {
        btn.className = 'tipe-btn py-2 rounded-lg text-slate-400';
      });
      const activeColors = {
        'Pengeluaran': 'bg-rose-600 text-white',
        'Pemasukan': 'bg-emerald-600 text-white',
        'Pindah Saldo': 'bg-sky-600 text-white'
      };
      document.getElementById('btn-' + tipe).className = 'tipe-btn py-2 rounded-lg ' + activeColors[tipe];

      const isTransfer = tipe === 'Pindah Saldo';
      document.getElementById('kategoriBox').classList.toggle('hidden', isTransfer);
      document.getElementById('tujuanBox').classList.toggle('hidden', !isTransfer);
      document.getElementById('labelDompet').innerText = isTransfer ? 'Dari Dompet' : 'Dompet';
    }

    async function loadData() {
      const url = getApiUrl();
      if (!url) return openSettings();

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.status === 'success') {
          document.getElementById('totalBalance').innerText = formatRp(data.totalBalance);
          
          const walletGrid = document.getElementById('walletGrid');
          walletGrid.innerHTML = Object.entries(data.balances).map(([name, val]) => `
            <div class="bg-black/20 rounded-lg px-2.5 py-1.5">
              <div class="text-[10px] text-emerald-200">${name}</div>
              <div class="font-bold text-xs">${formatRp(val)}</div>
            </div>
          `).join('');

          const recentList = document.getElementById('recentList');
          if (data.recent.length === 0) {
            recentList.innerHTML = '<p class="text-slate-500 text-xs text-center py-4">Belum ada transaksi.</p>';
          } else {
            recentList.innerHTML = data.recent.map(item => {
              const color = item.tipe === 'Pemasukan' ? 'text-emerald-400' : item.tipe === 'Pengeluaran' ? 'text-rose-400' : 'text-sky-400';
              const sign = item.tipe === 'Pemasukan' ? '+' : item.tipe === 'Pengeluaran' ? '-' : '⇄';
              const title = item.tipe === 'Pindah Saldo' ? `${item.dompet} → ${item.tujuan}` : `${item.kategori} (${item.dompet})`;
              return `
                <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-3 flex justify-between items-center">
                  <div>
                    <div class="font-semibold text-xs">${title}</div>
                    <div class="text-[11px] text-slate-400">${item.catatan || '-'} • ${item.tanggal}</div>
                  </div>
                  <div class="font-bold text-xs ${color}">${sign} ${formatRp(item.nominal)}</div>
                </div>
              `;
            }).join('');
          }
        }
      } catch (err) {
        alert('Gagal memuat data. Cek URL API di ikon gerigi.');
      }
    }

    document.getElementById('trxForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = getApiUrl();
      if (!url) return openSettings();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Menyimpan...';

      const tipe = document.getElementById('tipe').value;
      const payload = {
        tipe,
        nominal: document.getElementById('nominal').value,
        dompet: document.getElementById('dompet').value,
        kategori: tipe === 'Pindah Saldo' ? 'Transfer' : document.getElementById('kategori').value,
        tujuan: tipe === 'Pindah Saldo' ? document.getElementById('tujuan').value : '-',
        catatan: document.getElementById('catatan').value
      };

      try {
        await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        document.getElementById('nominal').value = '';
        document.getElementById('catatan').value = '';
        await loadData();
      } catch (err) {
        alert('Gagal menyimpan transaksi!');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Simpan Transaksi';
      }
    });

    loadData();
  </script>
</body>
</html>
